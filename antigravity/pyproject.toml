[project]
name = "antigravity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tominaga", email = "tominaga@utaha.io" }
]
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.13.0",
]

[project.scripts]
antigravity = "antigravity:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-bdd>=9.0.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

