[project]
name = "antigravity"
version = "0.1.0"
description = "Google ADK カスタムエージェント開発研修用プロジェクト"
readme = "README.md"
authors = [
    { name = "tominaga", email = "tominaga@utaha.io" }
]
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-bdd>=9.0.1",
    "ruff>=0.17.3",
]
hooks = [
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

